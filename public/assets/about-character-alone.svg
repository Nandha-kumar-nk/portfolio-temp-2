<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><defs>
    <!-- Sky Gradient inside circular window -->
    <radialGradient id="skyGrad" cx="65%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="40%" stop-color="#081326" />
      <stop offset="75%" stop-color="#030814" />
      <stop offset="100%" stop-color="#01040a" />
    </radialGradient>

    <!-- Moon Corona and Surface Gradients -->
    <radialGradient id="moonCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="moonBody" cx="42%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </radialGradient>

    <!-- Lake Reflection Gradient -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05152a" />
      <stop offset="50%" stop-color="#040e1c" />
      <stop offset="100%" stop-color="#02060e" />
    </linearGradient>

    <!-- Moon Reflection Shimmer -->
    <linearGradient id="moonReflectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <!-- Waterfall Glow -->
    <linearGradient id="waterfallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.9" />
    </linearGradient>

    <!-- Mountain Rim Light -->
    <linearGradient id="rimLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <clipPath id="portalClip">
      <circle cx="1260" cy="510" r="430" />
    </clipPath>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloomDeep" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs><g id="developer-character">
    <!-- Shadow Cast by Character and Bench on Floor -->
    <ellipse cx="1240" cy="855" rx="190" ry="32" fill="#000000" opacity="0.85" filter="url(#nuGlow)" />

    <!-- Sleek Techwear Bench (Carbon / Dark Titanium Minimalist Architecture) -->
    <g id="bench">
      <!-- Bench Top Surface -->
      <path d="M 1090 770 L 1390 770 L 1405 788 L 1075 788 Z" fill="url(#benchGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <!-- Bench Chamfered Edge with Subtle Cyan Accent Line -->
      <line x1="1075" y1="788" x2="1405" y2="788" stroke="#00f5ff" stroke-width="2" filter="url(#nuGlow)" />
      <!-- Bench Support Legs (Angled tech brackets) -->
      <path d="M 1120 788 L 1105 850 L 1125 850 L 1140 788 Z" fill="#0c111a" stroke="#1f2937" stroke-width="1.5" />
      <path d="M 1360 788 L 1345 850 L 1365 850 L 1380 788 Z" fill="#0c111a" stroke="#1f2937" stroke-width="1.5" />
      <!-- Subtle Under-Bench Ambient Cyan Glow Bar -->
      <line x1="1140" y1="792" x2="1340" y2="792" stroke="#38bdf8" stroke-width="3" opacity="0.4" filter="url(#nuGlow)" />
    </g>

    <!-- Seated Developer Figure (Back-view, gazing through window toward the moon) -->
    <g id="figure" transform="translate(1240, 680)">
      <!-- Sneaker Soles & Feet resting on floor -->
      <!-- Left Foot -->
      <path d="M -75 140 L -45 140 L -42 165 L -85 165 Z" fill="#090d14" stroke="#1f2937" stroke-width="1.5" />
      <line x1="-85" y1="165" x2="-42" y2="165" stroke="#00f5ff" stroke-width="2.5" filter="url(#nuGlow)" />
      <!-- Right Foot -->
      <path d="M 45 140 L 75 140 L 85 165 L 42 165 Z" fill="#090d14" stroke="#1f2937" stroke-width="1.5" />
      <line x1="42" y1="165" x2="85" y2="165" stroke="#00f5ff" stroke-width="2.5" filter="url(#nuGlow)" />

      <!-- Articulated Techwear Cargo Pants (Legs bent sitting on bench) -->
      <!-- Left Leg -->
      <path d="M -60 85 L -35 85 L -45 142 L -72 142 Z" fill="#0d121c" stroke="#1e293b" stroke-width="1.5" />
      <line x1="-66" y1="110" x2="-40" y2="110" stroke="#334155" stroke-width="2" />
      <!-- Right Leg -->
      <path d="M 35 85 L 60 85 L 72 142 L 45 142 Z" fill="#0d121c" stroke="#1e293b" stroke-width="1.5" />
      <line x1="40" y1="110" x2="66" y2="110" stroke="#334155" stroke-width="2" />

      <!-- Techwear Tactical Belt Straps & Lower Hem -->
      <path d="M -65 72 L 65 72 L 58 88 L -58 88 Z" fill="#080b11" />

      <!-- Oversized Dark Charcoal Techwear Hoodie (Torso & Shoulders) -->
      <!-- Main Hoodie Silhouette with anatomical drape and fabric creases -->
      <path d="M -105 18 C -112 40, -100 70, -70 82 C -40 88, 40 88, 70 82 C 100 70, 112 40, 105 18 C 98 -5, 65 -22, 38 -28 C 15 -30, -15 -30, -38 -28 C -65 -22, -98 -5, -105 18 Z" fill="url(#hoodieBody)" stroke="#1e293b" stroke-width="2" />
      
      <!-- Fabric Fold Details & Creases on Hoodie Back -->
      <path d="M -85 25 Q -55 45 -40 75" stroke="#0c1017" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 85 25 Q 55 45 40 75" stroke="#0c1017" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M -48 10 Q -10 28 0 28 Q 10 28 48 10" stroke="#0e131c" stroke-width="3.5" stroke-linecap="round" fill="none" />

      <!-- Relaxed Arms resting forward -->
      <path d="M -105 18 C -118 45, -112 85, -85 105 L -65 92 C -85 75, -92 45, -82 22 Z" fill="#0f1521" stroke="#1e293b" stroke-width="1.5" />
      <path d="M 105 18 C 118 45, 112 85, 85 105 L 65 92 C 85 75, 92 45, 82 22 Z" fill="#0f1521" stroke="#1e293b" stroke-width="1.5" />

      <!-- Relaxed Folded Hood Drapery on Neck & Back -->
      <path d="M -45 -22 C -55 -10, -48 12, -28 18 C -10 22, 10 22, 28 18 C 48 12, 55 -10, 45 -22 C 32 -32, -32 -32, -45 -22 Z" fill="#131924" stroke="#1f293d" stroke-width="2" />
      <path d="M -30 -18 C -20 -8, 20 -8, 30 -18" stroke="#080c13" stroke-width="3" fill="none" />

      <!-- Head & Beanie / Short Dark Hair Contour viewed from behind -->
      <ellipse cx="0" cy="-42" rx="30" ry="34" fill="#0a0e16" stroke="#172030" stroke-width="2" />
      <!-- Subtle Cyan Rim Light from the Portal Window on Head Edge -->
      <path d="M -26 -52 C -15 -72, 15 -72, 26 -52" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#nuGlow)" />

      <!-- THE GLOWING "NU" EMBLEM ON THE UPPER CENTER BACK OF HOODIE -->
      <!-- Centered prominently: cx: 0, cy: 40 -->
      <g id="glowing-nu-logo" transform="translate(0, 42)">
        <!-- Outer Luminous Cyan Halo -->
        <circle cx="0" cy="0" r="36" fill="#00f5ff" opacity="0.2" filter="url(#nuGlow)" />
        
        <!-- Subtle Circular Tech Emblem Border -->
        <circle cx="0" cy="0" r="28" stroke="#00f5ff" stroke-width="2" fill="#061220" opacity="0.9" filter="url(#nuGlow)" />
        <circle cx="0" cy="0" r="24" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4, 3" fill="none" opacity="0.8" />

        <!-- Crisp Glowing "NU" Monogram Letters -->
        <!-- Precise Cyber Font Geometry for N and U -->
        <g filter="url(#nuGlow)">
          <!-- Letter N -->
          <path d="M -16 11 L -16 -11 L -11 -11 L -3 5 L -3 -11 L 1 -11 L 1 11 L -4 11 L -12 -5 L -12 11 Z" fill="#00f5ff" />
          <!-- Letter U -->
          <path d="M 4 -11 L 8 -11 L 8 4 C 8 8, 10 10, 14 10 C 18 10, 20 8, 20 4 L 20 -11 L 24 -11 L 24 4 C 24 11, 20 13, 14 13 C 8 13, 4 11, 4 4 Z" fill="#00f5ff" />
          
          <!-- Inner Core White Hot Highlight -->
          <path d="M -14 9 L -14 -9 L -12 -9 L -5 5 L -5 -9 L -4 -9 L -4 9 L -6 9 L -13 -5 L -13 9 Z" fill="#e0faff" opacity="0.9" />
          <path d="M 6 -9 L 7 -9 L 7 4 C 7 7, 9 8.5, 14 8.5 C 19 8.5, 21 7, 21 4 L 21 -9 L 22 -9 L 22 4 C 22 9.5, 19 11.5, 14 11.5 C 9 11.5, 6 9.5, 6 4 Z" fill="#e0faff" opacity="0.9" />
        </g>
      </g>

      <!-- Floating Holographic Datapad at Character's Right Side (x ~ 140, y ~ 30) -->
      <g transform="translate(130, 25) rotate(-8)" filter="url(#nuGlow)">
        <!-- Hologram Screen -->
        <rect x="0" y="0" width="70" height="48" rx="5" fill="#06b6d4" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1.5" />
        <!-- Wireframe Lines on Hologram -->
        <line x1="8" y1="12" x2="40" y2="12" stroke="#38bdf8" stroke-width="2" />
        <line x1="8" y1="20" x2="62" y2="20" stroke="#00f5ff" stroke-width="1.2" opacity="0.8" />
        <line x1="8" y1="28" x2="52" y2="28" stroke="#00f5ff" stroke-width="1.2" opacity="0.8" />
        <line x1="8" y1="36" x2="32" y2="36" stroke="#38bdf8" stroke-width="1.5" />
        <!-- Corner Reticle -->
        <circle cx="58" cy="12" r="3" fill="#22d3ee" />
      </g>
    </g>
  </g>



  <!-- Layer 4: Foreground Vignette -->
  

  <defs>
    <radialGradient id="fgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>

    <!-- Top Architecture Beam -->
    <linearGradient id="topBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060b" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Top Ceiling Arch Edge -->
  <rect x="0" y="0" width="1920" height="45" fill="url(#topBeam)" />

  <!-- Subtle Corner Framing -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#fgVignette)" />


</svg>